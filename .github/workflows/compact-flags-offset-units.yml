name: Compact flags and offset AmuritesSimple units
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  graphics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install Pillow
      - name: Rebuild compact flags and offset sprites
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          import io, json, urllib.request
          root = Path("Images/TileSets/AmuritesSimple/Units")
          mapping = {
              "Amurite_adept.png":"Adept-Amurites",
              "Amurite_archer.png":"Archer-Amurites",
              "Amurite_beastmaster.png":"Beastmaster-Amurites",
              "Amurite_chanter.png":"Chanter",
              "Amurite_chariot.png":"Chariot-Amurites",
              "Amurite_hunter.png":"Hunter-Amurites",
              "Amurite_scout.png":"Scout-Amurites",
              "Amurite_wizard.png":"Wizard",
              "Govannon.png":"Govannon",
          }
          def make_sprite(source, output):
              art = Image.open(source).convert("RGBA")
              bbox = art.getchannel("A").getbbox()
              if bbox is None: raise ValueError("Empty sprite: " + str(source))
              art = art.crop(bbox)
              # Preserve the existing approved 600px maximum silhouette.
              art.thumbnail((600,600), Image.Resampling.LANCZOS)
              canvas = Image.new("RGBA",(1024,1024))
              # Shift right and down without crossing the canvas boundary.
              x = min(1024-art.width, max(0,(1024-art.width)//2+110))
              y = min(1024-art.height, max(0,(1024-art.height)//2+100))
              canvas.alpha_composite(art,(x,y))
              canvas.save(output)
          for source in mapping:
              make_sprite(root/source,root/("Registered_"+source))
          make_sprite(root/"Warrior.png",root/"Warrior.png.tmp.png")
          (root/"Warrior.png.tmp.png").replace(root/"Warrior.png")
          # Preserve existing flag artwork, but inset it in transparent images.
          names = ["UnitFlag","UnitFlagCivilian","UnitFlagCivilianInner",
                   "UnitFlagEmbark","UnitFlagFortify",
                   "UnitFlagSelection","UnitFlagSelectionCivilian",
                   "UnitFlagSelectionEmbark","UnitFlagSelectionFortify"]
          dest = Path("Images/UnitFlagIcons")
          dest.mkdir(parents=True,exist_ok=True)
          atlas=[]
          for name in names:
              url = ("https://raw.githubusercontent.com/yairm210/Unciv/master/"
                     "android/Images.ConstructionIcons/UnitFlagIcons/"+name+".png")
              with urllib.request.urlopen(url,timeout=30) as response:
                  original = Image.open(io.BytesIO(response.read())).convert("RGBA")
              # A 55% flag; selection halo is also reduced to avoid covering sprites.
              factor = 0.55 if "Selection" not in name else 0.42
              inset = original.resize((max(1,round(original.width*factor)),
                                       max(1,round(original.height*factor))),
                                      Image.Resampling.LANCZOS)
              canvas=Image.new("RGBA",original.size)
              canvas.alpha_composite(inset,((original.width-inset.width)//2,
                                            (original.height-inset.height)//2))
              target=dest/(name+".png")
              canvas.save(target)
              atlas.extend([str(target),"size: %d, %d"%original.size,
                            "format: RGBA8888","filter: Linear, Linear","repeat: none",
                            "UnitFlagIcons/"+name,"  rotate: false","  xy: 0, 0",
                            "  size: %d, %d"%original.size,
                            "  orig: %d, %d"%original.size,
                            "  offset: 0, 0","  index: -1",""])
          Path("compact-unit-flags.atlas").write_text("\n".join(atlas))
          manifest=Path("Atlases.json")
          entries=json.loads(manifest.read_text())
          if "compact-unit-flags" not in entries: entries.append("compact-unit-flags")
          manifest.write_text(json.dumps(entries,separators=(",",":"))+"\n")
          PY
      - name: Commit modified graphics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Atlases.json compact-unit-flags.atlas Images/UnitFlagIcons Images/TileSets/AmuritesSimple/Units/Registered_*.png Images/TileSets/AmuritesSimple/Units/Warrior.png
          git diff --cached --quiet || (git commit -m "Shrink unit flags and offset AmuritesSimple sprites" && git push)
