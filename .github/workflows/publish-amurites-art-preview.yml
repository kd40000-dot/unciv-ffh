name: Publish Amurite Artwork Preview
on:
  push:
    branches: [amurites-first-playable-01]
    paths:
      - '.github/workflows/publish-amurites-art-preview.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out artwork test branch
        uses: actions/checkout@v4
        with:
          ref: amurites-first-playable-01
          persist-credentials: false
      - name: Verify standalone Unciv mod and packed artwork
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          assert json.loads(Path('jsons/ModOptions.json').read_text())['isBaseRuleset'] is True
          for path in Path('jsons').glob('*.json'):
              json.loads(path.read_text())
          assert Path('game.png').is_file() and Path('game.atlas').is_file()
          assert Path('Atlases.json').read_text().strip() == '["game"]'
          assert not Path('android').exists() and not Path('core').exists()
          atlas = Path('game.atlas').read_text()
          required = [
              'LeaderIcons/Valledia',
              'NationIcons/Amurites',
              'UnitIcons/Firebow','UnitIcons/Govannon','UnitIcons/Wizard',
          ]
          for tileset in ('FantasyHex','AbsoluteUnits'):
              required += [f'TileSets/{tileset}/Units/{name}' for name in ('Firebow','Govannon','Wizard')]
          for key in required:
              image = Path('Images') / (key + '.png')
              assert image.is_file(), str(image)
              assert ('\n'+key+'\n') in atlas, 'Missing atlas entry: '+key
          assert Path('game.png').read_bytes().startswith(bytes.fromhex('89504e470d0a1a0a'))
          print('Validated', len(required), 'packed Amurite art regions and the ruleset JSON')
          PY
      - name: Prepare standalone preview mod ZIP
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import shutil, zipfile
          folder='unciv-ffh-amurites-art-preview-01'
          tmp=Path('/tmp')/folder
          if tmp.exists(): shutil.rmtree(tmp)
          tmp.mkdir(parents=True)
          shutil.copytree('jsons',tmp/'jsons')
          shutil.copytree('Images',tmp/'Images')
          for file in ('game.png','game.atlas','Atlases.json','README.md'):
              shutil.copy2(file,tmp/file)
          (tmp/'ART-PREVIEW-README.txt').write_text(
              'AMURITES ART PREVIEW 01 - not a complete FFH2 implementation\n'
              'Select the unciv ffh amurites art preview 01 base ruleset when starting a new game.\n'
              'Choose Amurites / Valledia. Inspect Firebow, Wizard and Govannon in the Civilopedia.\n'
              'Research Bowyers, Sorcery and Arcane Lore to train the units in a game.\n'
              'Govannon teaching, spells, Cave of Ancestors and mana are not yet working.\n'
              'The artwork preview is deliberately isolated from the working mod.\n'
          )
          out=Path.cwd()/(folder+'.zip')
          with zipfile.ZipFile(out,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=7) as z:
              for f in sorted(tmp.rglob('*')):
                  if f.is_file():
                      z.write(f, Path(folder)/f.relative_to(tmp))
          with zipfile.ZipFile(out) as z:
              assert z.testzip() is None
              paths=set(z.namelist())
              assert f'{folder}/jsons/ModOptions.json' in paths
              assert f'{folder}/game.atlas' in paths
              assert f'{folder}/game.png' in paths
              for name in ('Firebow','Govannon','Wizard'):
                  assert f'{folder}/Images/UnitIcons/{name}.png' in paths
          print('Published ZIP:',out,'bytes:',out.stat().st_size)
          PY
      - name: Publish direct-download GitHub prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG=amurites-art-preview-01
          ZIP=unciv-ffh-amurites-art-preview-01.zip
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" --clobber
          else
            gh release create "$TAG" "$ZIP" \
              --target "$GITHUB_SHA" \
              --title "Amurites artwork preview 01 (Unciv mod)" \
              --notes "Install this ZIP through Unciv > Mods > Download mod from URL. This is an isolated, incomplete base-ruleset preview of Valledia, the Amurite emblem, and Firebow/Wizard/Govannon icons and sprites. It does not include a finished FFH2 magic system." \
              --prerelease
          fi
