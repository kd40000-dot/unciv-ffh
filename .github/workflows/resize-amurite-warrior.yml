name: Resize Amurite Warrior sprite
on:
  push:
    paths:
      - '.github/workflows/resize-amurite-warrior.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  resize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resize sprite without changing artwork
        run: |
          python -m pip install pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          path = Path("Images/TileSets/AmuritesSimple/Units/Warrior.png")
          image = Image.open(path).convert("RGBA")
          bbox = image.getchannel("A").getbbox()
          if not bbox:
              raise RuntimeError("Warrior image is fully transparent")
          image = image.crop(bbox)
          image.thumbnail((300, 300), Image.Resampling.LANCZOS)
          canvas = Image.new("RGBA", (1024, 1024), (0, 0, 0, 0))
          canvas.alpha_composite(image, ((1024-image.width)//2, (1024-image.height)//2))
          canvas.save(path)
          print("Sprite bounds:", canvas.getchannel("A").getbbox())
          PY
      - name: Commit resized sprite
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Images/TileSets/AmuritesSimple/Units/Warrior.png
          git diff --cached --quiet || (git commit -m "Scale Amurite Warrior to match map units" && git push)
