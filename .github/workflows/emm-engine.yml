name: EMM engine fork Android debug build

on:
  workflow_dispatch:
  push:
    branches:
      - feature/emm-engine-2026-10-25
      - feature/emm-engine-framework-2026-10-25
      - checkpoint/emm-spell-wiring-inventory-2026-10-25
    paths:
      - "engine/**"
      - "jsons/**"
      - ".github/workflows/emm-engine.yml"

permissions:
  contents: read

jobs:
  build-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out mod and engine overlay
        uses: actions/checkout@v4
        with:
          path: ffh-mod
      - name: Check out pinned upstream Unciv source
        uses: actions/checkout@v4
        with:
          repository: yairm210/Unciv
          ref: b5c4bccd2b038f49183338811dc30efec81cb105
          path: unciv-source
          submodules: recursive
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install supported Android 36 SDK platform
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Apply EMM Kotlin overlay
        run: python3 ffh-mod/engine/apply_overlay.py unciv-source
      - name: Validate EMM ruleset spell registry and engine overlays
        run: |
          python3 -m py_compile ffh-mod/engine/apply_overlay.py
          python3 ffh-mod/engine/verify_spell_framework.py
          python3 ffh-mod/engine/verify_355_spell_wiring.py
      - name: Check patch diff for whitespace errors
        working-directory: unciv-source
        run: git diff --check
      - name: Compile patched Unciv core
        working-directory: unciv-source
        run: ./gradlew :core:compileKotlin --no-daemon --stacktrace
      - name: Build separately installable EMM Android client
        working-directory: unciv-source
        run: ./gradlew :android:assembleDebug --no-daemon --stacktrace
      - name: Publish test APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: unciv-emm-engine-debug
          path: unciv-source/android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
