name: Generate Khazad Vault icons
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/build_khazad_vault_icons.py'
      - '.github/workflows/generate-khazad-vault-icons.yml'
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate and register all vault stage icons
        run: |
          python3 -m pip install Pillow
          python3 tools/build_khazad_vault_icons.py
      - name: Commit generated building icons and atlas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Atlases.json khazad-vaults.atlas Images/BuildingIcons/
          git diff --cached --quiet || (git commit -m "Pack seven Khazad Vault building icons" && git push)
