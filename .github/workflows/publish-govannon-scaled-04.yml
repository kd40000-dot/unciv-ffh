name: Publish Govannon Scaled Art Preview 04
on:
  push:
    branches: [govannon-scaled-preview-04]
    paths:
      - '.github/workflows/publish-govannon-scaled-04.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: govannon-scaled-art-04
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact Amurites preview branch
        uses: actions/checkout@v4
        with:
          ref: govannon-scaled-preview-04
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image toolkit
        run: python -m pip install --disable-pip-version-check 'Pillow==11.3.0'
      - name: Regenerate approved icons, sprites and atlas
        run: python development/tools/build_five_approved_art.py
      - name: Verify all five images, units and atlas entries
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import json
          root=Path(".")
          units=json.loads((root/"jsons/Units.json").read_text())
          names=["Firebow","Wizard","Chanter","Adept","Govannon"]
          atlas=(root/"game.atlas").read_text()
          for n in names:
              unit=next((u for u in units if u["name"]==n),None)
              assert unit and unit["cost"]==12 and unit["requiredTech"]=="Agriculture",n
              key=f"UnitIcons/{n}"
              assert (root/"Images"/(key+".png")).exists()
              assert "\n"+key+"\n" in atlas
              assert Image.open(root/"Images"/(key+".png")).size==(96,96)
              for tileset in ("FantasyHex","AbsoluteUnits"):
                  key=f"TileSets/{tileset}/Units/{n}"
                  assert (root/"Images"/(key+".png")).exists()
                  assert "\n"+key+"\n" in atlas
                  assert Image.open(root/"Images"/(key+".png")).size==(84,84)
          assert Image.open(root/"Images/TileSets/FantasyHex/Units/Govannon.png").getchannel("A").getextrema()[0]==0
          im=Image.open(root/"Images/TileSets/FantasyHex/Units/Govannon.png").convert("RGBA")
          bounds=im.getbbox()
          assert bounds and bounds[3]-bounds[1]==43, bounds
          gov=next(u for u in units if u["name"]=="Govannon")
          assert not any("Limited to" in s or "Unbuildable" in s for s in gov.get("uniques",[]))
          for key in ("LeaderIcons/Valledia","NationIcons/Amurites"):
              assert "\n"+key+"\n" in atlas
              assert (root/"Images"/(key+".png")).exists()
          assert Image.open(root/"game.png").size==(1024,512)
          assert json.loads((root/"Atlases.json").read_text())==["game"]
          assert json.loads((root/"jsons/ModOptions.json").read_text())["isBaseRuleset"]
          for file in (root/"jsons").glob("*.json"):
              json.loads(file.read_text())
          print("Verified 5 approved character icons, 10 map sprites, Valledia and Amurite icon")
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Download official Unciv validator
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          URL=$(curl --fail --silent --show-error --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/yairm210/Unciv/releases/latest |
            jq -er '.assets[] | select(.name == "Unciv.jar") | .browser_download_url')
          curl --fail --location --retry 3 --silent --show-error "$URL" -o /tmp/Unciv.jar
          test -s /tmp/Unciv.jar
      - name: Validate official Unciv ruleset
        run: java -jar /tmp/Unciv.jar mod-ci
      - name: Commit approved assets to art-test branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Images/UnitIcons Images/TileSets game.atlas game.png Atlases.json
          if ! git diff --cached --quiet; then
            git commit -m 'Install exact approved Amurites five-unit icons and sprites'
            git push origin HEAD:govannon-scaled-preview-04
          fi
      - name: Build separate Android-installable mod ZIP
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import zipfile,shutil
          folder="unciv-ffh-govannon-scaled-04"
          dest=Path("/tmp")/folder
          if dest.exists():
              shutil.rmtree(dest)
          dest.mkdir(parents=True)
          for name in ("jsons","Images"):
              shutil.copytree(name,dest/name)
          for name in ("game.png","game.atlas","Atlases.json","README.md"):
              shutil.copy2(name,dest/name)
          (dest/"ARTWORK-PREVIEW.txt").write_text(
              "GOVANNON SCALED PIXEL ART 04 - VISUAL TEST ONLY\n"
              "Five approved designs: Firebow, Wizard, Chanter, Adept, Govannon.\n"
              "Cost 12 Production, requires Agriculture: test-only easy unlock.\n"
              "Govannon is unrestricted in this visual test, not in main gameplay.\n"
              "Choose Amurites and Valledia on a new game to inspect the units.\n"
          )
          out=Path.cwd()/(folder+".zip")
          with zipfile.ZipFile(out,"w",compression=zipfile.ZIP_DEFLATED,compresslevel=7) as z:
              for file in sorted(dest.rglob("*")):
                  if file.is_file():
                      z.write(file,Path(folder)/file.relative_to(dest))
          with zipfile.ZipFile(out) as z:
              assert z.testzip() is None
              paths=set(z.namelist())
              assert f"{folder}/jsons/Units.json" in paths
              assert f"{folder}/game.atlas" in paths
              assert f"{folder}/game.png" in paths
              for name in ("Firebow","Wizard","Chanter","Adept","Govannon"):
                  assert f"{folder}/Images/UnitIcons/{name}.png" in paths
          print("Verified ZIP:",out,out.stat().st_size)
          PY
      - name: Publish direct-download GitHub prerelease ZIP
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG=govannon-scaled-art-04
          ZIP=unciv-ffh-govannon-scaled-04.zip
          TARGET=$(git rev-parse HEAD)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" --clobber
          else
            gh release create "$TAG" "$ZIP" \
              --target "$TARGET" \
              --title "Govannon scaled pixel art 04 (five-unit Unciv test mod)" \
              --notes "Separate stock Unciv base-ruleset visual preview. Keeps approved Firebow, Wizard, Chanter, and Adept artwork; replaces only Govannon map sprite with selected pixel art, plus Valledia. Test-only unlocks and reduced costs. Full FFH2 gameplay is unfinished." \
              --prerelease
          fi
