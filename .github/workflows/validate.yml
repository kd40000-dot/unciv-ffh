name: Unciv ruleset validation
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Check JSON syntax
        run: |
          python3 - <<'PY'
          import json, pathlib
          for path in sorted(pathlib.Path("jsons").glob("*.json")):
              with path.open(encoding="utf-8") as f:
                  json.load(f)
              print("Valid JSON:", path)
          PY
      - name: Verify source-faithful EMM technology conversion
        run: python3 tools/verify_tech_tree.py
      - name: Verify EMM unit and building source fidelity
        run: python3 tools/verify_roster.py
      - name: Verify promotion, upgrades and resource conversion
        run: python3 tools/verify_progression.py
      - name: Verify EMM civilization source conversion
        run: python3 tools/verify_civilizations.py
      - name: Verify EMM starting units
        run: python3 tools/verify_starting_units.py
      - name: Verify selected EMM leaders and 19 palaces
        run: python3 tools/verify_leaders_palaces.py
      - name: Verify EMM raiding and barbarian economic traits
        run: python3 tools/verify_economic_traits.py
      - name: Verify Lanun Pirate Cove and workboat source conversion
        run: python3 tools/verify_lanun_cove.py
      - name: Verify EMM mana-node sources and all 21 buildable sphere improvements
        run: python3 tools/verify_mana_nodes.py
      - name: Verify mana-powered Fire I Blaze spell prototype
        run: python3 tools/verify_fire_i.py
      - name: Verify Body I temporary Haste spell
        run: python3 tools/verify_body_i.py
      - name: Verify Water I Spring spell terrain conversion and extinguishing
        run: python3 tools/verify_water_i.py
      - name: Verify Enchantment I Enchanted Blade aura
        run: python3 tools/verify_enchantment_i.py
      - name: Verify Khazad dynamic Dwarven Vault thresholds
        run: python3 tools/verify_khazad_vaults.py
      - name: Verify Erebus-specific diplomacy dialogue and provenance
        run: python3 tools/verify_erebus_diplomacy.py
      - name: Verify EMM leader portrait source mappings
        run: python3 tools/verify_leader_portraits.py --require-art
      - name: Verify 19 original transparent FfH2 civilization symbols and atlas
        run: python3 tools/verify_civilization_emblems.py
      - name: Verify packed leader portrait texture atlas
        run: python3 tools/verify_leader_atlas.py
      - name: Verify full-color tech artwork is not era-tinted
        run: python3 tools/verify_technology_art_contrast.py
      - name: Verify all Amurites and civilization-colored civilian unit sprites
        run: python3 tools/verify_civilization_unit_sprites.py
      - name: Validate using the official Unciv mod-ci command
        run: |
          curl -fsSL https://api.github.com/repos/yairm210/Unciv/releases/latest -o /tmp/unciv-release.json
          UNCIV_URL="$(python3 -c 'import json; r=json.load(open("/tmp/unciv-release.json")); print(next(a["browser_download_url"] for a in r["assets"] if a["name"]=="Unciv.jar"))')"
          curl -fL --retry 3 "$UNCIV_URL" -o Unciv.jar
          set -euo pipefail
          java -jar Unciv.jar mod-ci | tee /tmp/unciv-mod-ci.log
          if grep -q '^Warning:' /tmp/unciv-mod-ci.log; then
            echo "Unciv reported ruleset warnings; failing validation"
            exit 1
          fi
