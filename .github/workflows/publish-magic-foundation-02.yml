name: Publish Amurite Magic Foundation 02
on:
  push:
    branches: [magic-foundation-0.2]
    paths:
      - '.github/workflows/publish-magic-foundation-02.yml'
      - 'jsons/**'
      - 'development/tools/build_five_approved_art.py'
      - 'development/tools/build_five_approved_art.py'
      - 'development/assets/firebow-pixel-10.png.b64'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: amurite-magic-foundation-02
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact Amurites preview branch
        uses: actions/checkout@v4
        with:
          ref: magic-foundation-0.2
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image toolkit
        run: python -m pip install --disable-pip-version-check 'Pillow==11.3.0'
      - name: Regenerate approved icons, sprites and atlas
        run: python development/tools/build_five_approved_art.py
      - name: Verify all five images, units and atlas entries
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import json
          root=Path(".")
          units=json.loads((root/"jsons/Units.json").read_text())
          names=["Firebow","Wizard","Chanter","Adept","Govannon"]
          atlas=(root/"game.atlas").read_text()
          for n in names:
              unit=next((u for u in units if u["name"]==n),None)
              assert unit is not None,n
              expected={
                  "Firebow":(120,"Bowyers"),
                  "Wizard":(120,"Sorcery"),
                  "Chanter":(120,"Poisons"),
                  "Adept":(90,"Knowledge of the Ether"),
                  "Govannon":(480,"Arcane Lore")
              }
              assert (unit["cost"],unit["requiredTech"])==expected[n],(n,unit)
              key=f"UnitIcons/{n}"
              assert (root/"Images"/(key+".png")).exists()
              assert "\n"+key+"\n" in atlas
              assert Image.open(root/"Images"/(key+".png")).size==(96,96)
              for tileset in ("FantasyHex","AbsoluteUnits"):
                  key=f"TileSets/{tileset}/Units/{n}"
                  assert (root/"Images"/(key+".png")).exists()
                  assert "\n"+key+"\n" in atlas
                  assert Image.open(root/"Images"/(key+".png")).size==(84,84)
          assert Image.open(root/"Images/TileSets/FantasyHex/Units/Govannon.png").getchannel("A").getextrema()[0]==0
          im=Image.open(root/"Images/TileSets/FantasyHex/Units/Govannon.png").convert("RGBA")
          bounds=im.getbbox()
          assert bounds and bounds[3]-bounds[1]==43, bounds
          assert Image.open(root/"Images/UnitIcons/Govannon.png").convert("RGBA").getchannel("A").getextrema()==(0,255)
          chanter=Image.open(root/"Images/TileSets/FantasyHex/Units/Chanter.png").convert("RGBA")
          assert chanter.getbbox() and chanter.getbbox()[3]-chanter.getbbox()[1]==43
          assert chanter.getchannel("A").getextrema()[0]==0
          adept=Image.open(root/"Images/TileSets/FantasyHex/Units/Adept.png").convert("RGBA")
          assert adept.getbbox() and adept.getbbox()[3]-adept.getbbox()[1]==43
          wizard=Image.open(root/"Images/TileSets/FantasyHex/Units/Wizard.png").convert("RGBA")
          assert wizard.getbbox() and wizard.getbbox()[3]-wizard.getbbox()[1]==43
          assert wizard.getchannel("A").getextrema()[0]==0
          firebow=Image.open(root/"Images/TileSets/FantasyHex/Units/Firebow.png").convert("RGBA")
          assert firebow.getbbox() and firebow.getbbox()[3]-firebow.getbbox()[1]==43
          gov=next(u for u in units if u["name"]=="Govannon")
          assert "Limited to [1] per Civilization" in gov.get("uniques",[])
          for key in ("LeaderIcons/Valledia","NationIcons/Amurites"):
              assert "\n"+key+"\n" in atlas
              assert (root/"Images"/(key+".png")).exists()
          assert Image.open(root/"game.png").size==(1024,1024)
          nation=next(n for n in json.loads((root/"jsons/Nations.json").read_text()) if n["name"]=="Amurites")
          assert all(f"Provides [1] [{sphere} Mana]" in nation["uniques"] for sphere in ("Body","Fire","Mind"))
          res=json.loads((root/"jsons/TileResources.json").read_text())
          improvements=json.loads((root/"jsons/TileImprovements.json").read_text())
          assert all(any(r["name"]==name for r in res) for name in ["Raw Mana","Body Mana","Fire Mana","Mind Mana","Death Mana"])
          assert all(any(i["name"]==name for i in improvements) for name in ("Body Node","Fire Node","Mind Node","Death Node"))
          promotions=json.loads((root/"jsons/UnitPromotions.json").read_text())
          body=next(p for p in promotions if p["name"]=="Body I")
          assert any("gains the [Hastened] status" in u for u in body["uniques"])
          for name in ("Raw Mana","Body Mana","Fire Mana","Mind Mana","Death Mana"):
              icon="ResourceIcons/"+name
              assert (root/"Images"/(icon+".png")).exists()
              assert "\n"+icon+"\n" in atlas
          for name in ("Body Node","Fire Node","Mind Node","Death Node"):
              icon="ImprovementIcons/"+name
              assert (root/"Images"/(icon+".png")).exists()
              assert "\n"+icon+"\n" in atlas
          assert json.loads((root/"Atlases.json").read_text())==["game"]
          assert json.loads((root/"jsons/ModOptions.json").read_text())["isBaseRuleset"]
          for file in (root/"jsons").glob("*.json"):
              json.loads(file.read_text())
          print("Verified 5 approved character icons, 10 map sprites, Valledia and Amurite icon")
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Download official Unciv validator
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          URL=$(curl --fail --silent --show-error --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/yairm210/Unciv/releases/latest |
            jq -er '.assets[] | select(.name == "Unciv.jar") | .browser_download_url')
          curl --fail --location --retry 3 --silent --show-error "$URL" -o /tmp/Unciv.jar
          test -s /tmp/Unciv.jar
      - name: Validate official Unciv ruleset
        run: |
          set -euo pipefail
          java -jar /tmp/Unciv.jar mod-ci 2>&1 | tee /tmp/magic-mod-ci.log
          if grep -Ei '^(Warning:|Error:)' /tmp/magic-mod-ci.log; then
            echo 'Unciv emitted ruleset warnings or errors'
            exit 1
          fi
      - name: Commit approved assets to art-test branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Images/UnitIcons Images/TileSets game.atlas game.png Atlases.json
          if ! git diff --cached --quiet; then
            git commit -m 'Install exact approved Amurites five-unit icons and sprites'
            git push origin HEAD:magic-foundation-0.2
          fi
      - name: Build separate Android-installable mod ZIP
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import zipfile,shutil
          folder="unciv-ffh-magic-foundation-02"
          dest=Path("/tmp")/folder
          if dest.exists():
              shutil.rmtree(dest)
          dest.mkdir(parents=True)
          for name in ("jsons","Images","docs"):
              shutil.copytree(name,dest/name)
          for name in ("game.png","game.atlas","Atlases.json","README.md"):
              shutil.copy2(name,dest/name)
          (dest/"ARTWORK-PREVIEW.txt").write_text(
              "AMURITE MAGIC FOUNDATION 02 - VISUAL TEST ONLY\n"
              "Five approved designs: Firebow, Wizard, Chanter, Adept, Govannon.\n"
              "Cost 12 Production, requires Agriculture: test-only easy unlock.\n"
              "Govannon is unrestricted in this visual test, not in main gameplay.\n"
              "Choose Amurites and Valledia on a new game to inspect the units.\n"
          )
          out=Path.cwd()/(folder+".zip")
          with zipfile.ZipFile(out,"w",compression=zipfile.ZIP_DEFLATED,compresslevel=7) as z:
              for file in sorted(dest.rglob("*")):
                  if file.is_file():
                      z.write(file,Path(folder)/file.relative_to(dest))
          with zipfile.ZipFile(out) as z:
              assert z.testzip() is None
              paths=set(z.namelist())
              assert f"{folder}/jsons/Units.json" in paths
              assert f"{folder}/game.atlas" in paths
              assert f"{folder}/game.png" in paths
              for name in ("Firebow","Wizard","Chanter","Adept","Govannon"):
                  assert f"{folder}/Images/UnitIcons/{name}.png" in paths
          print("Verified ZIP:",out,out.stat().st_size)
          PY
      - name: Publish direct-download GitHub prerelease ZIP
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG=amurite-magic-foundation-02
          ZIP=unciv-ffh-magic-foundation-02.zip
          TARGET=$(git rev-parse HEAD)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" --clobber
          else
            gh release create "$TAG" "$ZIP" \
              --target "$TARGET" \
              --title "Amurite magic foundation 02 (five-unit Unciv test mod)" \
              --notes "Separate stock Unciv base-ruleset visual preview. Restores unit progression and adds mana nodes, sphere promotions and a provisional self-Haste unit action, retaining previously approved art. See docs/MAGIC_0.2.md for limitations. Test-only unlocks and reduced costs. Full FFH2 gameplay is unfinished." \
              --prerelease
          fi
