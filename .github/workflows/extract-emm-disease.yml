name: Extract EMM disease promotion source
on:
  push:
    paths:
      - 'scripts/extract_emm_disease_source.py'
      - '.github/workflows/extract-emm-disease.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: bewlay/extramodmod
          ref: 60b0ec3740083162aaab7bf8491761a54a65a610
          path: emm-source
          sparse-checkout: |
            XML/Units/CIV4PromotionInfos.xml
          persist-credentials: false
      - run: python3 scripts/extract_emm_disease_source.py emm-source
      - name: Commit source inventory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/emm-disease-promotions.json
          git diff --cached --quiet || (git commit -m "Inventory pinned EMM disease promotions" && git pull --rebase origin main && git push)
