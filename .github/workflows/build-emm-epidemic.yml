name: Build EMM epidemic engine test APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/patch_unciv_health.py'
      - 'tools/patch_emm_epidemic_damage.py'
      - 'tools/patch_emm_default_races.py'
      - 'tools/patch_emm_typed_damage.py'
      - 'tools/patch_emm_defense_context.py'
      - 'tools/patch_emm_typed_battle.py'
      - 'tools/patch_emm_city_defense.py'
      - 'tools/patch_emm_city_defense_state.py'
      - 'tools/patch_emm_building_defense.py'
      - 'tools/patch_emm_ranged_defense.py'
      - 'tools/patch_emm_bombard_state.py'
      - 'tools/patch_emm_bombard_protection.py'
      - 'tools/patch_emm_siege_bombard.py'
      - 'tools/patch_emm_religions_alignment.py'
      - 'tools/verify_emm_religions_alignment.py'
      - 'tools/verify_emm_siege_bombard.py'
      - 'tools/patch_emm_culture_defense.py'
      - 'tools/patch_emm_culture_progression.py'
      - 'docs/data/emm-culture-defense.json'
      - 'tools/patch_emm_unit_levels.py'
      - 'docs/data/emm-typed-combat-strength.json'
      - 'docs/data/emm-unit-defense.json'
      - 'docs/data/emm-typed-resistances.json'
      - 'tools/verify_emm_epidemic_damage.py'
      - '.github/workflows/build-emm-epidemic.yml'
permissions:
  contents: read
jobs:
  android-epidemic:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned Unciv source
        uses: actions/checkout@v4
        with:
          repository: yairm210/Unciv
          ref: fce8c9895f604be0e26b4213f8692b7356cbe4b8
          path: upstream-unciv
          persist-credentials: false
      - name: Checkout pinned EMM building definitions
        uses: actions/checkout@v4
        with:
          repository: bewlay/extramodmod
          ref: 60b0ec3740083162aaab7bf8491761a54a65a610
          path: upstream-emm
          persist-credentials: false
      - name: Verify live EMM building-defense generator
        run: python3 tools/verify_emm_building_defense.py
      - name: Verify source EMM siege bombard action generation
        run: python3 tools/verify_emm_siege_bombard.py
      - name: Verify building bombard-protection source mapping
        run: python3 tools/verify_emm_bombard_protection.py
      - name: Verify pinned EMM ranged-improvement XML values
        run: python3 tools/verify_emm_ranged_defense.py upstream-emm
      - name: Test idempotent epidemic engine patch
        run: python3 tools/verify_emm_epidemic_damage.py
      - name: Generate health and event engine
        run: |
          python3 tools/patch_unciv_health.py upstream-unciv
          python3 tools/patch_emm_epidemic_damage.py upstream-unciv
          python3 tools/patch_emm_default_races.py upstream-unciv
          python3 tools/patch_emm_typed_damage.py upstream-unciv
          python3 tools/patch_emm_defense_context.py upstream-unciv
          python3 tools/patch_emm_typed_battle.py upstream-unciv
          python3 tools/patch_emm_city_defense.py upstream-unciv
          python3 tools/patch_emm_unit_levels.py upstream-unciv
          python3 tools/patch_emm_city_defense_state.py upstream-unciv
          python3 tools/patch_emm_culture_defense.py upstream-unciv
          python3 tools/patch_emm_culture_progression.py upstream-unciv
          python3 tools/patch_emm_building_defense.py upstream-unciv upstream-emm
          python3 tools/patch_emm_ranged_defense.py upstream-unciv
          python3 tools/patch_emm_bombard_state.py upstream-unciv
          python3 tools/patch_emm_bombard_protection.py upstream-unciv upstream-emm
          python3 tools/patch_emm_siege_bombard.py upstream-unciv upstream-emm
          python3 tools/patch_emm_religions_alignment.py upstream-unciv upstream-emm
      - name: Verify source-backed EMM religion and alignment state
        run: python3 tools/verify_emm_religions_alignment.py upstream-unciv
      - name: Check generated Kotlin changes
        run: |
          grep -q 'private fun damageLivingUnits' upstream-unciv/core/src/com/unciv/logic/city/EmmArmageddonEvents.kt
          grep -q 'private fun emmTypedStrengthMultiplier' upstream-unciv/core/src/com/unciv/logic/battle/BattleDamage.kt
          grep -q 'private fun sourceDefense(unit: MapUnit)' upstream-unciv/core/src/com/unciv/logic/map/mapunit/EmmTypedDamage.kt
          grep -q 'toReturn.emmAlignment = emmAlignment' upstream-unciv/core/src/com/unciv/logic/civilization/Civilization.kt
          grep -q 'EmmSiegeBombard.actions(unit)' upstream-unciv/core/src/com/unciv/logic/map/mapunit/actions/UnitActions.kt
          grep -q 'EmmBombardProtection.forCity(city)' upstream-unciv/core/src/com/unciv/logic/city/EmmCityDefense.kt
          grep -q 'EmmCityDefense.startCityTurn' upstream-unciv/core/src/com/unciv/logic/city/managers/CityTurnManager.kt
          grep -q 'EmmRangedDefense.forCity(city)' upstream-unciv/core/src/com/unciv/logic/map/mapunit/EmmTypedDamage.kt
          grep -q 'EmmBuildingDefense.local(city)' upstream-unciv/core/src/com/unciv/logic/map/mapunit/EmmTypedDamage.kt
          grep -q 'object EmmTypedDamage' upstream-unciv/core/src/com/unciv/logic/map/mapunit/EmmTypedDamage.kt
          grep -q 'EMM CIVILIZATION_INFERNAL DefaultRace' upstream-unciv/core/src/com/unciv/logic/civilization/managers/UnitManager.kt
          cd upstream-unciv
          git diff --check
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile Android test build
        working-directory: upstream-unciv
        run: ./gradlew :android:assembleDebug --no-daemon --stacktrace
      - name: Publish test APK
        uses: actions/upload-artifact@v4
        with:
          name: EMM-Epidemic-Engine-Debug
          path: upstream-unciv/android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
