name: Register all Amurites and civilization-colored civilian sprites
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/register-amurites-simple-sprites.yml'
      - 'tools/build_amurites_and_civilian_sprites.py'
permissions:
  contents: write
jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install imaging dependencies
        run: python3 -m pip install Pillow numpy
      - name: Register Amurites and recolor generic Worker and Settler sashes
        run: python3 tools/build_amurites_and_civilian_sprites.py
      - name: Ensure atlas paths and outputs exist
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          atlas=Path("amurites-simple-complete.atlas").read_text()
          pages=[x for x in atlas.splitlines() if x.startswith("Images/") and x.endswith(".png")]
          assert len(pages)==63, len(pages)
          assert all(Path(page).is_file() for page in pages)
          assert json.loads(Path("Atlases.json").read_text())[-1]=="amurites-simple-complete"
          assert len(set(pages))==63
          for page in pages:
              assert atlas.count(page)==1
          print("OK: 63 image pages, images present, complete atlas last")
          PY
      - name: Check horizontal edge alignment and full visibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          files = sorted(Path("Images/TileSets/AmuritesSimple/Units/Generated").glob("*.png"))
          assert len(files) == 63, len(files)
          for path in files:
              with Image.open(path) as im:
                  assert im.size == (512, 512), (path, im.size)
                  bbox = im.convert("RGBA").getchannel("A").getbbox()
                  assert bbox, f"Empty sprite: {path}"
                  left = path.stem.startswith(("Worker", "Settler"))
                  assert (bbox[0] == 0 if left else bbox[2] == 512), (path, bbox)
                  assert bbox[1] > 0 and bbox[3] < 512, (path, bbox)
          print("OK: 21 Amurites shifted completely right; 42 civilian sprites completely left, with no clipping")
          PY
      - name: Commit generated sprites and atlas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Atlases.json amurites-simple-complete.atlas Images/TileSets/AmuritesSimple/Units/Generated/
          git diff --cached --quiet || (git commit -m "Register all Amurites and civilization-colored Worker/Settler sprites" && git push)
