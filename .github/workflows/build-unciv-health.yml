name: Build Unciv with EMM health prototype
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/patch_unciv_health.py'
      - '.github/workflows/build-unciv-health.yml'
permissions:
  contents: read
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: yairm210/Unciv
          ref: fce8c9895f604be0e26b4213f8692b7356cbe4b8
          path: upstream-unciv
          persist-credentials: false
      - name: Preserve working mod-download HTTP fix
        run: python3 tools/patch_unciv_download_client.py upstream-unciv
      - name: Apply EMM health patch
        run: python3 tools/patch_unciv_health.py upstream-unciv
      - name: Add credited Game-icons health symbol
        run: |
          python3 -m pip install cairosvg
          curl -fL --retry 3 'https://game-icons.net/icons/ffffff/transparent/1x1/sbed/health-normal.svg' -o /tmp/emm-health.svg
          mkdir -p upstream-unciv/android/Images.Icons/StatIcons
          python3 - <<'PY'
          import cairosvg
          cairosvg.svg2png(url='/tmp/emm-health.svg',write_to='upstream-unciv/android/Images.Icons/StatIcons/EMMHealth.png',output_width=128,output_height=128)
          PY
      - name: Install side-by-side with existing Unciv
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('upstream-unciv/android/build.gradle.kts')
          s=p.read_text()
          anchor='applicationIdSuffix = ".httpfix"'
          assert s.count(anchor)==1
          p.write_text(s.replace(anchor,'applicationIdSuffix = ".emmhealth"'))
          PY
      - name: Verify patch scope
        run: |
          cd upstream-unciv
          git diff --check
          git diff --stat
          git diff --stat
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile Kotlin engine
        working-directory: upstream-unciv
        run: ./gradlew :core:compileKotlin --no-daemon --stacktrace
      - name: Build Android debug APK
        working-directory: upstream-unciv
        run: ./gradlew :android:assembleDebug --no-daemon --stacktrace
      - name: Publish test build
        run: |
          APK="$(find upstream-unciv/android/build/outputs/apk/debug -name '*.apk' -print -quit)"
          test -s "$APK"
          cp "$APK" Unciv-EMM-Health-Test.apk
          sha256sum Unciv-EMM-Health-Test.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Unciv-EMM-Health-Test-APK
          path: Unciv-EMM-Health-Test.apk
          if-no-files-found: error
          retention-days: 30
