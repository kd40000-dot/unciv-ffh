name: Build Unciv with EMM health prototype
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/patch_unciv_health.py'
      - '.github/workflows/build-unciv-health.yml'
permissions:
  contents: read
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: yairm210/Unciv
          ref: fce8c9895f604be0e26b4213f8692b7356cbe4b8
          path: upstream-unciv
          persist-credentials: false
      - name: Apply source patch
        run: python3 tools/patch_unciv_health.py upstream-unciv
      - name: Verify patch only changes city health accounting
        run: |
          cd upstream-unciv
          git diff --check
          git diff --stat
          git diff -- core/src/com/unciv/logic/city/CityStats.kt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile Kotlin engine
        working-directory: upstream-unciv
        run: ./gradlew :core:compileKotlin --no-daemon --stacktrace
      - name: Build Android debug APK
        working-directory: upstream-unciv
        run: ./gradlew :android:assembleDebug --no-daemon --stacktrace
      - name: Publish test build
        run: |
          APK="$(find upstream-unciv/android/build/outputs/apk/debug -name '*.apk' -print -quit)"
          test -s "$APK"
          cp "$APK" Unciv-EMM-Health-Test.apk
          sha256sum Unciv-EMM-Health-Test.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Unciv-EMM-Health-Test-APK
          path: Unciv-EMM-Health-Test.apk
          if-no-files-found: error
          retention-days: 30
