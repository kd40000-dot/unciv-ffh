name: Generate EMM placeholder sprites
on:
  push:
    branches:
      - checkpoint/placeholder-sprites-2026-10-25
    paths:
      - 'art/generate_placeholders.py'
      - 'jsons/Units.json'
      - 'jsons/Nations.json'
      - '.github/workflows/placeholder-sprites.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: checkpoint/placeholder-sprites-2026-10-25
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'Pillow>=10,<13'
      - name: Generate and validate transparent sprite placeholders
        run: |
          python art/generate_placeholders.py
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          m=json.loads(Path('art/PLACEHOLDER_SPRITES.json').read_text())
          assert m['count'] > 100, m['count']
          for r in m['sprites']:
              p=Path(r['path'])
              with Image.open(p) as im:
                  assert im.mode=='RGBA' and im.size==(128,128), p
                  assert im.getpixel((0,0))[3]==0, p
          print('Checked',m['count'],'new transparent PNGs')
          PY
      - name: Commit generated assets, atlases, and placeholder manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Images/TileSets/AmuritesSimple/Units/Generated placeholder-generated.atlas Atlases.json art/PLACEHOLDER_SPRITES.json art/PLACEHOLDER_SPRITES.md
          if ! git diff --cached --quiet; then
            git commit -m "Generate all missing race-aware and faction-colored unit placeholder PNGs"
            git push
          fi
