name: Package installable Unciv FFH mod
on:
  workflow_dispatch:
  push:
    paths:
      - 'Images/**'
      - 'jsons/**'
      - '*.atlas'
      - 'Atlases.json'
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check mod content and build zip
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,zipfile
          root=Path('.')
          assert (root/'jsons/Units.json').exists()
          assert (root/'Atlases.json').exists()
          assert (root/'amurites-simple-complete.atlas').exists()
          for atlas in json.loads((root/'Atlases.json').read_text()):
              assert (root/(atlas+'.atlas')).exists(),atlas
          with zipfile.ZipFile('unciv-ffh-installable.zip','w',zipfile.ZIP_DEFLATED,compresslevel=6) as z:
              for p in root.rglob('*'):
                  if not p.is_file() or '.git' in p.parts or p.name=='unciv-ffh-installable.zip': continue
                  if p.parts[0] in ('scripts','.github'): continue
                  z.write(p,p.as_posix())
          print('Packaged',Path('unciv-ffh-installable.zip').stat().st_size,'bytes')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: unciv-ffh-installable
          path: unciv-ffh-installable.zip
          retention-days: 30
