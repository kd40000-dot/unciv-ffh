name: Validate Standalone FFH2 Mod
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON and exclude engine files
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          assert json.loads(Path('jsons/ModOptions.json').read_text())['isBaseRuleset'] is True
          assert not Path('core').exists() and not Path('android').exists(), 'Unciv engine files must not be included'
          assert not Path('build.gradle.kts').exists() and not Path('gradlew').exists(), 'No custom app build'
          for p in Path('jsons').glob('*.json'):
              json.loads(p.read_text())
              print('OK',p)
          PY
  unciv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Download official Unciv release
        run: |
          set -euo pipefail
          URL=$(curl --fail --silent --show-error https://api.github.com/repos/yairm210/Unciv/releases/latest |
            jq -er '.assets[] | select(.name == "Unciv.jar") | .browser_download_url')
          curl --fail --location --retry 3 --silent --show-error "$URL" -o /tmp/Unciv.jar
      - name: Run official mod validator
        run: java -jar /tmp/Unciv.jar mod-ci
