name: Validate Standalone FFH2 Mod
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate JSON and exclude engine files
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          assert json.loads(Path('jsons/ModOptions.json').read_text())['isBaseRuleset'] is True
          assert not Path('core').exists() and not Path('android').exists(), 'Unciv engine files must not be included'
          assert not Path('build.gradle.kts').exists() and not Path('gradlew').exists(), 'No custom app build'
          for p in Path('jsons').glob('*.json'):
              json.loads(p.read_text())
              print('OK',p)
          PY
      - name: Check unit artwork and atlas
        run: python3 tools/validate_artwork.py
  unciv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Download official Unciv release using authenticated API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          URL=$(curl --fail --silent --show-error --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/yairm210/Unciv/releases/latest |
            jq -er '.assets[] | select(.name == "Unciv.jar") | .browser_download_url')
          curl --fail --location --retry 3 --silent --show-error "$URL" -o /tmp/Unciv.jar
          test -s /tmp/Unciv.jar
      - name: Run official mod validator (warnings are failures)
        shell: bash
        run: |
          set -euo pipefail
          java -jar /tmp/Unciv.jar mod-ci 2>&1 | tee /tmp/unciv-mod-ci.log
          if grep -Ei '^(Warning:|Error:)' /tmp/unciv-mod-ci.log; then
            echo 'Unciv ruleset validation reported warnings or errors'
            exit 1
          fi
